<!DOCTYPE html>
<html>
<head>
<title>BMI Calculator</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#6a11cb,#2575fc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
width:300px;
}

h2{
color:#2575fc;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#2575fc;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1a5edb;
}

.result{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>BMI Calculator - Welcomes YOU</h2>

<input type="number" id="weight" placeholder="Weight (kg)">

<input type="number" id="height" placeholder="Height (cm)">

<button onclick="calculateBMI()">Calculate BMI</button>

<div class="result" id="output"></div>

</div>

<script>

function calculateBMI(){

let weight=document.getElementById("weight").value
let height=document.getElementById("height").value

height=height/100

let bmi=weight/(height*height)

bmi=bmi.toFixed(2)

let category=""

if(bmi<18.5)
category="Underweight"

else if(bmi<25)
category="Normal Weight"

else if(bmi<30)
category="Overweight"

else
category="Obese"

document.getElementById("output").innerHTML=
"Your BMI: "+bmi+"<br>"+category

}

</script>

</body>
</html>
